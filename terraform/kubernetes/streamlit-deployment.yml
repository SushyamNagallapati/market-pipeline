apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: market-pipeline
  labels:
    app: streamlit
spec:
  replicas: 2 # 2 copies — if one crashes, the other stays up
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      containers:
        - name: streamlit
          image: sushyamn/market-streamlit:latest
          ports:
            - containerPort: 8501
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: pipeline-config
                  key: POSTGRES_HOST
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: pipeline-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: pipeline-config
                  key: POSTGRES_USER
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: pipeline-config
                  key: POSTGRES_PORT
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: postgres-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe: # Kubernetes restarts container if this fails
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe: # Kubernetes only sends traffic when this passes
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-service
  namespace: market-pipeline
spec:
  selector:
    app: streamlit
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer # Azure creates a public IP automatically
