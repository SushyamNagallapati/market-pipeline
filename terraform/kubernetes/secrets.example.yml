# secrets.example.yml
# Template only. Safe to commit because it holds no real values.
# To use: cp secrets.example.yml secrets.yml, fill in real values,
# then: kubectl apply -f secrets.yml
# The real secrets.yml is git-ignored and must never be committed.
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-secrets
  namespace: market-pipeline
type: Opaque
stringData:
  postgres-password: "CHANGE_ME"
  news-api-key: "CHANGE_ME"
  postgres-host: "your-db-server.postgres.database.azure.com"
  postgres-user: "pipeline_user"
  postgres-db: "market_pipeline"
