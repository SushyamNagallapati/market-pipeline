# App CI/CD: test on every push and PR, deploy images on pushes to main.
# Infrastructure is handled separately in terraform.yml.

name: Market Pipeline CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      # throwaway Postgres for the dbt tests
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pipeline_user
          POSTGRES_PASSWORD: pipeline123
          POSTGRES_DB: market_pipeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            yfinance \
            psycopg2-binary \
            requests \
            python-dotenv \
            dbt-postgres \
            flake8

      # line length 100 because the default 79 is too tight
      - name: Lint with flake8
        run: |
          flake8 ingestion/ \
            --max-line-length=100 \
            --exclude=__pycache__ \
            --count \
            --statistics

      - name: Load schema
        env:
          PGPASSWORD: pipeline123
        run: |
          psql -h localhost -U pipeline_user -d market_pipeline_test \
            -f db/schema/001_init.sql

      - name: Run dbt tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: pipeline_user
          POSTGRES_PASSWORD: pipeline123
          POSTGRES_DB: market_pipeline_test
        run: |
          cd dbt_project/market_pipeline
          dbt deps
          dbt run --profiles-dir .
          dbt test --profiles-dir .

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: test
    # skipped until the Azure OIDC variables exist (see scripts/setup-github-oidc.sh)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
    # lets the job request the OIDC token for the Azure login
    permissions:
      contents: read
      id-token: write
    # terraform.yml owns the infrastructure; this job only builds images and
    # points the existing Container Apps at them

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # OIDC login, no stored password. One-time setup: scripts/setup-github-oidc.sh
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Streamlit image
        run: |
          docker build --platform linux/amd64 \
            -f docker/Dockerfile.streamlit \
            -t ${{ env.IMAGE_PREFIX }}/market-streamlit:latest \
            -t ${{ env.IMAGE_PREFIX }}/market-streamlit:${{ github.sha }} \
            .
          docker push ${{ env.IMAGE_PREFIX }}/market-streamlit:latest
          docker push ${{ env.IMAGE_PREFIX }}/market-streamlit:${{ github.sha }}

      - name: Build and push Airflow image
        run: |
          docker build --platform linux/amd64 \
            -f docker/Dockerfile.airflow \
            -t ${{ env.IMAGE_PREFIX }}/market-airflow:latest \
            -t ${{ env.IMAGE_PREFIX }}/market-airflow:${{ github.sha }} \
            .
          docker push ${{ env.IMAGE_PREFIX }}/market-airflow:latest
          docker push ${{ env.IMAGE_PREFIX }}/market-airflow:${{ github.sha }}

      - name: Deploy Streamlit to Container Apps
        run: |
          az containerapp update \
            --name market-pipeline-dashboard \
            --resource-group market-pipeline-rg \
            --image ${{ env.IMAGE_PREFIX }}/market-streamlit:${{ github.sha }}

      - name: Deploy Airflow to Container Apps
        run: |
          az containerapp update \
            --name market-pipeline-airflow \
            --resource-group market-pipeline-rg \
            --image ${{ env.IMAGE_PREFIX }}/market-airflow:${{ github.sha }}

      - name: Deployment summary
        run: |
          echo "Deployed successfully"
          echo "Streamlit: ${{ env.IMAGE_PREFIX }}/market-streamlit:${{ github.sha }}"
          echo "Airflow: ${{ env.IMAGE_PREFIX }}/market-airflow:${{ github.sha }}"
