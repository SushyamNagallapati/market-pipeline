# dbt_project/market_pipeline/profiles.yml
# This is used by Airflow inside Docker — different from your local ~/.dbt/profiles.yml
# Uses 'postgres' as host because that's the Docker service name, not localhost

market_pipeline:
  outputs:
    dev:
      type: postgres
      host: postgres
      port: 5432
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: analytics
      threads: 4
  target: dev
