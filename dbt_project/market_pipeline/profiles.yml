# dbt_project/market_pipeline/profiles.yml
# Used by Airflow inside Docker and by CI.
# Connection details come from environment variables so no secrets live in git.
#   Local Docker: values come from .env via docker-compose (host = 'postgres')
#   Azure:        values are injected by the container app (host = the Azure DB address)
# The password has no default on purpose: if it's missing, dbt fails loudly.

market_pipeline:
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: analytics
      threads: 4
  target: dev
